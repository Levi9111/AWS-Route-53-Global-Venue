services:
  mongo:
    image: mongo:7
    container_name: global-venuefinder-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - venuefinder_net
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./route-53-backend
      dockerfile: Dockerfile
    container_name: global-venuefinder-backend
    restart: unless-stopped
    env_file:
      - path: ./route-53-backend/.env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      MONGO_URI: mongodb://mongo:27017/global-venuefinder
      DATABASE_URL: mongodb://mongo:27017/global-venuefinder
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-global_venuefinder_jwt_secret_change_in_prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    ports:
      - '5000:5000'
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - venuefinder_net

  frontend:
    build:
      context: ./route-53-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    container_name: global-venuefinder-frontend
    restart: unless-stopped
    env_file:
      - path: ./route-53-frontend/.env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - venuefinder_net

volumes:
  mongo_data:

networks:
  venuefinder_net:
    driver: bridge
